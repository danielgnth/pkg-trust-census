<text x="16" y="512" font-size="10" fill="#8a8984">Each category: a release earns 1 point for the strong signal, ½ for only the weak one, 0 for neither. The category value is the mean over</text>
<text x="16" y="526" font-size="10" fill="#8a8984">packages, (strong × 1 + weak × ½) ÷ n; the score is the mean of the three category values. Ranges: the upper end counts unknown signals as</text>
<text x="16" y="540" font-size="10" fill="#8a8984">present. Transparency log is not scored, because every Sigstore signature is logged. ½ is a convention (docs/methodology.md).</text>
</svg>
