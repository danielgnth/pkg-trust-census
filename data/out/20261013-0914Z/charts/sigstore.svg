}</style><g transform="translate(0,-23)" font-weight="600" font-size="11" text-anchor="start" fill="#52514e" aria-label="text"><text transform="translate(22,44)" y="0.71em">Latest releases with a bundle</text></g><g transform="translate(0,-10)" font-size="11" text-anchor="start" fill="#8a8984" aria-label="text"><text transform="translate(22,44)" y="0.71em">share of sampled packages</text></g><g fill="#f0efec" aria-label="bar"><rect rx="4" height="20" y="57" width="240" x="22"><title>npm: 10 of 50 sampled latest releases carry a Sigstore bundle</title></rect><rect rx="4" height="20" y="103" width="240" x="22"><title>PyPI: 32 of 50 sampled latest releases carry a Sigstore bundle</title></rect><rect rx="4" height="20" y="149" width="240" x="22"><title>RubyGems: 13 of 50 sampled latest releases carry a Sigstore bundle</title></rect><rect rx="4" height="20" y="195" width="240" x="22"><title>Maven Central: 0 of 50 sampled latest releases carry a Sigstore bundle</title></rect></g><g fill="#1c5cab" aria-label="bar"><path d="M22,61A0,0 0 0 1 22,61H66A4,4 0 0 1 70,65V69A4,4 0 0 1 66,73H22A0,0 0 0 1 22,73Z"><title>npm: 10 of 50 sampled latest releases carry a Sigstore bundle</title></path><path d="M22,107A0,0 0 0 1 22,107H171.6A4,4 0 0 1 175.6,111V115A4,4 0 0 1 171.6,119H22A0,0 0 0 1 22,119Z"><title>PyPI: 32 of 50 sampled latest releases carry a Sigstore bundle</title></path><path d="M22,153A0,0 0 0 1 22,153H80.4A4,4 0 0 1 84.4,157V161A4,4 0 0 1 80.4,165H22A0,0 0 0 1 22,165Z"><title>RubyGems: 13 of 50 sampled latest releases carry a Sigstore bundle</title></path></g><g transform="translate(10,23)" font-size="11" text-anchor="start" aria-label="text"><text transform="translate(262,44)" y="0.32em">20% (10/50)</text><text transform="translate(262,90)" y="0.32em">64% (32/50)</text><text transform="translate(262,136)" y="0.32em">26% (13/50)</text><text transform="translate(262,182)" y="0.32em">0% (0/50)</text></g><g transform="translate(0,23)" font-size="11" text-anchor="start" fill="#52514e" aria-label="text"><text transform="translate(22,228)" y="0.32em">instead: login-gated event log<title>A login-gated log of security events (ownership, maintainers, version references); not a log of artifacts.</title></text><text transform="translate(22,274)" y="0.32em">instead: none (TUF experiment only)<title>None deployed. A TUF signing experiment exists; trusted publishing records the commit from the CI's OIDC token, but nothing is signed for consumers.</title></text><text transform="translate(22,320)" y="0.32em">instead: own checksum log, checked by default<title>sum.golang.org, Google's own append-only Merkle log of module hashes with signed tree heads, checked by the go command by default. A transparency log like Rekor, but of hashes, not publisher identities.</title></text></g></svg></g>
<text x="16" y="466" font-size="10" fill="#8a8984">"Best install client" is the strongest default or opt-in check among the clients listed in sigstore.md, newer ones included.</text>
</svg>
