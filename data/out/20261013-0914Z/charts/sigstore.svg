<svg xmlns="http://www.w3.org/2000/svg" width="874" height="484" viewBox="0 0 874 484" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" color="#0b0b0b">
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f0efec"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c9c8c2" stroke-width="2"/></pattern><pattern id="hatch-weak" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#86b6ef"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1c5cab" stroke-width="2"/></pattern></defs>
