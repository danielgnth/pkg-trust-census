<text x="16" y="24" font-size="15" font-weight="600" fill="#0b0b0b">Sigstore across registries</text>
<text x="16" y="42" font-size="11" fill="#52514e">Who accepts Sigstore bundles, who checks them, and how many top packages ship one · snapshot 13 Oct 2026, 09:14 UTC</text>
<rect x="16" y="58" width="14" height="10" rx="2" fill="#1c5cab"/><text x="38" y="67" font-size="11" fill="#52514e">yes</text>
<rect x="70.5" y="58" width="14" height="10" rx="2" fill="#6da7ec"/><text x="92.5" y="67" font-size="11" fill="#52514e">opt-in / planned</text>
<rect x="196.5" y="58" width="14" height="10" rx="2" fill="#f0efec" stroke="#c9c8c2" stroke-width="1"/><text x="218.5" y="67" font-size="11" fill="#52514e">no</text>
<rect x="245.5" y="58" width="14" height="10" rx="2" fill="url(#hatch)" stroke="#c9c8c2" stroke-width="1"/><text x="267.5" y="67" font-size="11" fill="#52514e">n/a</text>
<g transform="translate(0,80)"><svg style="color:#0b0b0b;background:transparent;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 502 366" height="366" width="502" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" fill="currentColor" class="plot-d6a7b5"><style>:where(.plot-d6a7b5) {
  --plot-background: white;
  display: block;
  height: auto;
  height: intrinsic;
  max-width: 100%;
}
:where(.plot-d6a7b5 text),
:where(.plot-d6a7b5 tspan) {
  white-space: pre;
}</style><g transform="translate(61,-10)" font-weight="600" font-size="11" fill="#52514e" aria-label="x-axis tick label"><text transform="translate(120,44)">Accepts bundles</text><text transform="translate(242,44)">Registry checks at upload</text><text transform="translate(364,44)">Best install client</text></g><g transform="translate(-10,23)" font-size="12" text-anchor="end" fill="#0b0b0b" aria-label="y-axis tick label"><text transform="translate(120,44)" y="0.32em">npm</text><text transform="translate(120,90)" y="0.32em">PyPI</text><text transform="translate(120,136)" y="0.32em">RubyGems</text><text transform="translate(120,182)" y="0.32em">Maven Central</text><text transform="translate(120,228)" y="0.32em">Packagist</text><text transform="translate(120,274)" y="0.32em">crates.io</text><text transform="translate(120,320)" y="0.32em">Go</text></g><g aria-label="cell"><rect fill="#1c5cab" rx="4" height="44" y="45" width="120" x="121"><title>npm: The tarball, by the publisher's CI identity (Fulcio), as SLSA provenance in dist.attestations; npm adds a publish attestation signed with its own registry key. Both are logged in the public Rekor.</title></rect><rect fill="#1c5cab" rx="4" height="44" y="45" width="120" x="243"><title>npm: registry verifies bundles at upload: yes</title></rect><rect fill="#6da7ec" rx="4" height="44" y="45" width="120" x="365"><title>npm install clients: npm 12 opt-in; pnpm 12 no; Yarn 4 no; Bun no</title></rect><rect fill="#1c5cab" rx="4" height="44" y="91" width="120" x="121"><title>PyPI: Each distribution file, by the Trusted Publisher's CI identity (PEP 740), served through the Integrity API. Most bundles carry the publish predicate, not SLSA provenance.</title></rect><rect fill="#1c5cab" rx="4" height="44" y="91" width="120" x="243"><title>PyPI: registry verifies bundles at upload: yes</title></rect><rect fill="#f0efec" rx="4" height="44" y="91" width="120" x="365"><title>PyPI install clients: pip 26 no; uv 0.12 no</title></rect><rect fill="#1c5cab" rx="4" height="44" y="137" width="120" x="121"><title>RubyGems: The .gem, by the CI identity, via `gem push --attestation` (RubyGems 3.6, used by rubygems/release-gem); served at /api/v1/attestations. Accepted only from a trusted-publishing push.</title></rect><rect fill="#1c5cab" rx="4" height="44" y="137" width="120" x="243"><title>RubyGems: registry verifies bundles at upload: yes</title></rect><rect fill="#f0efec" rx="4" height="44" y="137" width="120" x="365"><title>RubyGems install clients: gem / Bundler 4 no</title></rect><rect fill="#1c5cab" rx="4" height="44" y="183" width="120" x="121"><title>Maven Central: Any deployed file, as an optional .sigstore.json next to the mandatory PGP .asc.</title></rect><rect fill="#1c5cab" rx="4" height="44" y="183" width="120" x="243"><title>Maven Central: registry verifies bundles at upload: yes</title></rect><rect fill="#f0efec" rx="4" height="44" y="183" width="120" x="365"><title>Maven Central install clients: Maven 3/4 no; Gradle 9 no</title></rect><rect fill="#6da7ec" rx="4" height="44" y="229" width="120" x="121"><title>Packagist: Nothing yet: hosted artifacts with SLSA provenance and Sigstore attestations verified by Composer are a stated direction (2026-05), with news promised 2026-09-29.</title></rect><rect fill="url(#hatch)" rx="4" height="44" y="229" width="120" x="243"><title>Packagist: registry verifies bundles at upload: n/a</title></rect><rect fill="url(#hatch)" rx="4" height="44" y="229" width="120" x="365"><title>Packagist install clients: Composer 2.10 n/a</title></rect><rect fill="#f0efec" rx="4" height="44" y="275" width="120" x="121"><title>crates.io: Nothing: the Sigstore RFC for Cargo (#3403) was closed unmerged in 2023.</title></rect><rect fill="url(#hatch)" rx="4" height="44" y="275" width="120" x="243"><title>crates.io: registry verifies bundles at upload: n/a</title></rect><rect fill="url(#hatch)" rx="4" height="44" y="275" width="120" x="365"><title>crates.io install clients: cargo n/a</title></rect><rect fill="#f0efec" rx="4" height="44" y="321" width="120" x="121"><title>Go: Nothing: modules are fetched from VCS and authors cannot sign them.</title></rect><rect fill="url(#hatch)" rx="4" height="44" y="321" width="120" x="243"><title>Go: registry verifies bundles at upload: n/a</title></rect><rect fill="url(#hatch)" rx="4" height="44" y="321" width="120" x="365"><title>Go install clients: go n/a</title></rect></g><g transform="translate(61,23)" font-weight="600" font-size="13" aria-label="text"><text fill="#ffffff" transform="translate(242,44)" y="0.32em">yes</text><text fill="#ffffff" transform="translate(242,90)" y="0.32em">yes</text><text fill="#52514e" transform="translate(364,90)" y="0.32em">no</text><text fill="#ffffff" transform="translate(242,136)" y="0.32em">yes</text><text fill="#52514e" transform="translate(364,136)" y="0.32em">no</text><text fill="#ffffff" transform="translate(242,182)" y="0.32em">yes</text><text fill="#52514e" transform="translate(364,182)" y="0.32em">no</text><text fill="#0b0b0b" transform="translate(120,228)" y="0.32em">planned</text><text fill="#52514e" transform="translate(242,228)" y="0.32em">n/a</text><text fill="#52514e" transform="translate(364,228)" y="0.32em">n/a</text><text fill="#52514e" transform="translate(120,274)" y="0.32em">no</text><text fill="#52514e" transform="translate(242,274)" y="0.32em">n/a</text><text fill="#52514e" transform="translate(364,274)" y="0.32em">n/a</text><text fill="#52514e" transform="translate(120,320)" y="0.32em">no</text><text fill="#52514e" transform="translate(242,320)" y="0.32em">n/a</text><text fill="#52514e" transform="translate(364,320)" y="0.32em">n/a</text></g><g transform="translate(61,17)" font-weight="600" font-size="13" aria-label="text"><text fill="#ffffff" transform="translate(120,44)" y="0.32em">yes</text><text fill="#0b0b0b" transform="translate(364,44)" y="0.32em">opt-in</text><text fill="#ffffff" transform="translate(120,90)" y="0.32em">yes</text><text fill="#ffffff" transform="translate(120,136)" y="0.32em">yes</text><text fill="#ffffff" transform="translate(120,182)" y="0.32em">yes</text></g><g transform="translate(61,32)" font-size="10" fill-opacity="0.85" aria-label="text"><text fill="#ffffff" transform="translate(120,44)" y="0.32em">since Apr 2023</text><text fill="#0b0b0b" transform="translate(364,44)" y="0.32em">npm 12</text><text fill="#ffffff" transform="translate(120,90)" y="0.32em">since Nov 2024</text><text fill="#ffffff" transform="translate(120,136)" y="0.32em">since Dec 2024</text><text fill="#ffffff" transform="translate(120,182)" y="0.32em">since Jan 2025</text></g></svg></g>
<g transform="translate(502,80)"><svg style="color:#0b0b0b;background:transparent;font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 372 366" height="366" width="372" text-anchor="middle" font-size="10" font-family="system-ui, sans-serif" fill="currentColor" class="plot-d6a7b5"><style>:where(.plot-d6a7b5) {
